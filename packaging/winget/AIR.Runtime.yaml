ReleaseNotes: |
  Initial release of AIR Runtime for Windows.
  - Windows-native daemon (aird) with named pipe IPC
  - Interactive shell (air) with policy-governed tool execution
  - Windows-native secrets via Credential Manager
  - AppContainer sandbox for risky tools
  - WFP-based egress enforcement
  - ETW telemetry for enterprise visibility
  - Windows Service installation with recovery actions
  - Group Policy / ADMX admin policy support
  - AMSI / Windows Defender integration
