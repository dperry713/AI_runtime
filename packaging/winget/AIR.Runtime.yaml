ShortDescription: AIR - AI Runtime Daemon and Shell for Windows
Description: |
  AIR is a production-grade, AI-native agent runtime and shell for Windows.
  It is a long-running daemon (aird) that hosts LLM-driven agents as managed,
  supervised, observable, policy-governed processes, plus an interactive shell
  (air) that talks to the daemon over a Windows named pipe.

  Every agent action (model call, tool call, approval, memory write) is an
  event in an append-only journal, so any run can be audited, resumed after a
  crash, and deterministically replayed. Every tool call passes through a
  deny-by-default policy engine and, for process execution, an OS-level
  sandbox (Windows Job Objects). Everything is logged in structured form and
  covered by extensive automated tests.

